<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14161c"/>
      <stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
    <linearGradient id="cardTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232836"/>
      <stop offset="1" stop-color="#1a1d26"/>
    </linearGradient>
    <linearGradient id="cardMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20252f"/>
      <stop offset="1" stop-color="#171a21"/>
    </linearGradient>
    <linearGradient id="cardLow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2229"/>
      <stop offset="1" stop-color="#14181d"/>
    </linearGradient>
    <linearGradient id="remote" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2333"/>
      <stop offset="1" stop-color="#1e1a26"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4176e6"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e5484d"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#30a46c"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c91a0"/>
    </marker>
  </defs>

  <rect width="960" height="660" fill="url(#bgGrad)"/>

  <!-- ================= 第一层: DSH 进程内 ================= -->
  <text x="28" y="36" fill="#8c91a0" font-size="13">进程内 · DSH web (127.0.0.1:3081)</text>
  <g filter="url(#shadow)">
    <rect x="28" y="48" width="610" height="150" rx="10" fill="url(#cardTop)" stroke="#2a2e3a" stroke-width="1.2"/>
    <text x="48" y="78" fill="#e8eaed" font-size="16" font-weight="bold">dsh-git-rescue 插件</text>
    <text x="48" y="102" fill="#8c91a0" font-size="12">设置页 · token 配置 / 触发策略 / 手动备份·回退</text>
    <text x="48" y="124" fill="#8c91a0" font-size="12">自动 commit（启动 / 定时 30min / 事件）</text>
    <text x="48" y="146" fill="#8c91a0" font-size="12">心跳写入 · Agent 工具 (backup / status / rollback)</text>
    <rect x="48" y="158" width="150" height="26" rx="6" fill="#2a3a5c" stroke="#4176e6" stroke-width="1"/>
    <text x="123" y="176" fill="#7ea2ff" font-size="12" text-anchor="middle">❤ 心跳 / 自动 commit</text>
  </g>

  <!-- 远端 GitHub（右上） -->
  <g filter="url(#shadow)">
    <rect x="700" y="48" width="232" height="150" rx="10" fill="url(#remote)" stroke="#3a2f4d" stroke-width="1.2"/>
    <text x="720" y="78" fill="#e8eaed" font-size="16" font-weight="bold">GitHub 远端备份</text>
    <text x="720" y="102" fill="#8c91a0" font-size="12">dsh-git-rescue-backup-&lt;机器名&gt;</text>
    <rect x="720" y="118" width="180" height="26" rx="6" fill="#2a2e3a" stroke="#8c91a0" stroke-width="1"/>
    <text x="810" y="136" fill="#c9cdd4" font-size="12" text-anchor="middle">🔑 token (HTTPS) push</text>
    <text x="720" y="178" fill="#7a5ea8" font-size="11">仅 token 方案 · 不设 SSH</text>
  </g>

  <!-- ================= 第二层: git 仓库 ================= -->
  <text x="28" y="230" fill="#8c91a0" font-size="13">本地 git 仓库 · 版本历史</text>
  <g filter="url(#shadow)">
    <rect x="28" y="242" width="610" height="150" rx="10" fill="url(#cardMid)" stroke="#2a2e3a" stroke-width="1.2"/>
    <text x="48" y="272" fill="#e8eaed" font-size="16" font-weight="bold">git 仓库（.dsh + workspace 白名单）</text>
    <text x="48" y="296" fill="#8c91a0" font-size="12">commit: chore(guard): &lt;触发原因&gt; | &lt;自检摘要&gt;</text>
    <text x="48" y="318" fill="#8c91a0" font-size="12">坏点标记 bad · 回退前全量副本 · 最大回退 N 步</text>
    <rect x="48" y="332" width="150" height="26" rx="6" fill="#1e2e24" stroke="#30a46c" stroke-width="1"/>
    <text x="123" y="350" fill="#5fd08d" font-size="12" text-anchor="middle">↩ 回退 = git reset</text>
    <rect x="220" y="332" width="150" height="26" rx="6" fill="#2e2020" stroke="#e5484d" stroke-width="1"/>
    <text x="295" y="350" fill="#f07881" font-size="12" text-anchor="middle">💥 commit 坏状态</text>
    <text x="400" y="350" fill="#8c91a0" font-size="11">.gitignore: node_modules · *.fpk · *.zip · 凭据</text>
  </g>

  <!-- ================= 第三层: guardian 独立进程 ================= -->
  <text x="28" y="426" fill="#8c91a0" font-size="13">独立进程 · guardian（DSH 之外存活）</text>
  <g filter="url(#shadow)">
    <rect x="28" y="438" width="610" height="150" rx="10" fill="url(#cardLow)" stroke="#2a2e3a" stroke-width="1.2"/>
    <text x="48" y="468" fill="#e8eaed" font-size="16" font-weight="bold">guardian 守护进程</text>
    <text x="48" y="492" fill="#8c91a0" font-size="12">进程探活 (10s) · 心跳超时检测 (60s) · 启动自检</text>
    <text x="48" y="514" fill="#8c91a0" font-size="12">崩溃 → commit 坏状态 → 自动回退 → 拉起 DSH → 自检</text>
    <text x="48" y="536" fill="#8c91a0" font-size="12">动作全程写 guardian.log 留痕</text>
    <rect x="48" y="548" width="150" height="26" rx="6" fill="#2e2020" stroke="#e5484d" stroke-width="1"/>
    <text x="123" y="566" fill="#f07881" font-size="12" text-anchor="middle">🛟 崩溃自动救援</text>
  </g>

  <!-- 手动兜底 -->
  <g filter="url(#shadow)">
    <rect x="700" y="438" width="232" height="150" rx="10" fill="url(#cardLow)" stroke="#2a2e3a" stroke-width="1.2"/>
    <text x="720" y="468" fill="#e8eaed" font-size="16" font-weight="bold">手动兜底</text>
    <text x="720" y="492" fill="#8c91a0" font-size="12">git log --oneline</text>
    <text x="720" y="514" fill="#8c91a0" font-size="12">git reset --hard &lt;commit&gt;</text>
    <text x="720" y="536" fill="#8c91a0" font-size="11">什么都崩了也永远可用</text>
  </g>

  <!-- ================= 连线 ================= -->
  <!-- 心跳/commit: 插件 -> git 仓库 (蓝) -->
  <path d="M 178 198 L 333 242" fill="none" stroke="#4176e6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- commit 坏状态: git -> 插件回退 (绿) -->
  <path d="M 120 242 L 123 198" fill="none" stroke="#30a46c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <!-- push: git 仓库 -> GitHub (蓝) -->
  <path d="M 638 300 L 700 190" fill="none" stroke="#4176e6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- 崩溃检测: 插件 -> guardian (红) -->
  <path d="M 120 198 L 120 438" fill="none" stroke="#e5484d" stroke-width="2" marker-end="url(#arrowRed)"/>
  <!-- guardian 回退: guardian -> git 仓库 (绿) -->
  <path d="M 333 438 L 333 392" fill="none" stroke="#30a46c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <!-- guardian 拉起 DSH (灰/蓝) -->
  <path d="M 240 438 L 240 198" fill="none" stroke="#8c91a0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>
  <!-- 手动: git 命令 -> 仓库 (灰) -->
  <path d="M 700 540 L 638 392" fill="none" stroke="#8c91a0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>

  <!-- 图例 -->
  <g font-size="11">
    <text x="28" y="625" fill="#8c91a0">图例:</text>
    <line x1="80" y1="621" x2="115" y2="621" stroke="#4176e6" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="122" y="625" fill="#8c91a0">数据流</text>
    <line x1="175" y1="621" x2="210" y2="621" stroke="#e5484d" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="217" y="625" fill="#8c91a0">故障</text>
    <line x1="260" y1="621" x2="295" y2="621" stroke="#30a46c" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="302" y="625" fill="#8c91a0">恢复</text>
    <line x1="345" y1="621" x2="380" y2="621" stroke="#8c91a0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>
    <text x="387" y="625" fill="#8c91a0">拉起/手动</text>
  </g>
</svg>
