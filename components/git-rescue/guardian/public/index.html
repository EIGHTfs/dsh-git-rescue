<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dsh-git-rescue Guardian - 救援面板</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🛟 dsh-git-rescue Guardian</h1>
      <div class="status-line">
        <span id="dsh-status" class="badge unknown">检测中…</span>
        <span id="auto-flag" class="dim"></span>
      </div>
      <div id="restart-request-flag" class="msg warn" style="display:none"></div>
    </header>

    <section class="card">
      <h2>手动控制</h2>
      <div class="btn-row">
        <button id="btn-check" class="btn">🔍 立即检查</button>
        <button id="btn-start" class="btn ok">▶ 启动 DSH</button>
        <button id="btn-recover" class="btn danger">↩ 手动救援（git 回退）</button>
      </div>
      <div id="action-msg" class="msg"></div>
    </section>

    <section class="card">
      <h2>git 提交历史 <span id="git-count" class="count"></span></h2>
      <div id="git-list" class="list"><div class="empty">加载中…</div></div>
    </section>

    <section class="card">
      <h2>监控日志</h2>
      <div id="log" class="log"><div class="empty">暂无日志</div></div>
      <button id="btn-clear-log" class="btn small">清空日志显示</button>
    </section>
  </div>
  <script src="/app.js"></script>
</body>
</html>
